name: dev-sec-ops-v1r1
title: DevSecOps Pipeline and Control-Plane Validation
maintainer: Clem
copyright: SPDX-License-Identifier MIT OR Apache-2.0
license: MIT OR Apache-2.0
summary: >-
  Verifies that a DevSecOps pipeline is in place: that expected scans run and
  emit valid artifacts, that the forge's security capabilities are enabled, and
  that merge protection is enforced. Runs both as an in-pipeline bolt-on and
  standalone against the platform control plane.
version: 1.1.0
supports: []
inspec_version: '>= 5.0'

# =============================================================================
# INPUTS
#
# Every non-scalar default MUST be declared here. A control doing
# `input('x', value: [...])` or `input('x', value: some_method)` crashes
# `check` and `json` outright with "undefined method 'value' for an instance of
# RuboCop::AST::ArrayNode/SendNode" UNLESS the input is declared in this file.
# The failure is at parse time and takes the whole profile down with it.
# =============================================================================

inputs:

  # ---- Run mode -------------------------------------------------------------
  # Which control families are eligible. Explicit, never inferred: "no artifacts
  # on disk" must not be indistinguishable from "this mode does not check
  # artifacts".
  - name: run_mode
    type: string
    value: 'control-plane'
    description: 'pipeline | control-plane | both.'

  # ---- Declaration (control-plane mode) -------------------------------------
  # See inputs/risk-sentinel-org.yml for a worked example, and
  # files/tool_registry.yml for what the profile can detect.

  - name: organization
    type: hash
    value: {}
    description: >-
      Forge and organisation/group name. Supplies the reconciliation
      denominator, which is enumerated through the forge API rather than read
      from this file.

  - name: targets
    type: array
    value: []
    description: >-
      Repositories to assess, each declaring every scan type as enabled true or
      false. There is no omission option: an omitted scan type would render as
      Not Applicable, which reads as "does not apply" rather than "nobody
      looked".

  - name: exclusions
    type: array
    value: []
    description: >-
      Repositories deliberately not assessed. Each entry needs a written
      `reason`. Archived, fork and template repositories are NOT auto-excluded.

  - name: defaults
    type: hash
    value: {}
    description: 'Baseline `scans:` block that targets inherit and override per key.'

  # ---- Credentials ----------------------------------------------------------
  # InSpec resources cannot call input(); the control body reads these and
  # passes them into the resource through its opts hash. Values come from CI
  # secrets, never from a committed file.
  - name: github_token
    type: string
    value: ''
    sensitive: true
    description: 'GitHub token. Falls back to GITHUB_TOKEN / GH_TOKEN in the environment.'

  - name: gitlab_token
    type: string
    value: ''
    sensitive: true
    description: 'GitLab token. Falls back to GITLAB_TOKEN in the environment.'

  - name: github_api_base
    type: string
    value: 'https://api.github.com'
    description: 'Override for GitHub Enterprise Server.'

  - name: gitlab_api_base
    type: string
    value: ''
    description: 'GitLab instance API base. Per-instance; no sensible default.'

  - name: protected_branch
    type: string
    value: 'main'
    description: 'Branch whose protection and review requirements are assessed.'

  # ===========================================================================
  # LEGACY — pipeline artifact toggles
  #
  # Consumed by controls/artifacts.rb, which has not yet been migrated onto the
  # declaration model above. They are retained so the existing fourteen
  # controls keep parsing, NOT because both models should coexist.
  #
  # These are removed, and the version goes to 2.0.0, in the phase that
  # migrates artifacts.rb onto `targets`. Adding a new expect_* toggle here
  # instead of a registry entry is going the wrong way.
  # ===========================================================================

  - name: artifact_dir
    type: string
    value: 'reports'
    description: 'Directory containing pipeline report artifacts.'

  - name: expect_sast
    type: boolean
    value: false
  - name: expect_secrets
    type: boolean
    value: false
  - name: expect_trufflehog
    type: boolean
    value: false
  - name: expect_lint
    type: boolean
    value: false
  - name: expect_quality
    type: boolean
    value: false
  - name: expect_code_review
    type: boolean
    value: false
  - name: expect_sbom
    type: boolean
    value: false
  - name: expect_dependency
    type: boolean
    value: false
  - name: expect_trivy
    type: boolean
    value: false
  - name: expect_grype
    type: boolean
    value: false
  - name: expect_snyk
    type: boolean
    value: false
  - name: expect_container_sig
    type: boolean
    value: false
  - name: expect_inspec_deployed
    type: boolean
    value: false
  - name: expect_license
    type: boolean
    value: false

  - name: license_source
    type: string
    value: 'sonatype'
    description: 'Which tool/process performed OSS license review: sonatype | trivy | snyk | manual.'

  - name: sast_report
    type: string
    value: 'sast.sarif'
  - name: secrets_report
    type: string
    value: 'secrets.json'
  - name: trufflehog_report
    type: string
    value: 'trufflehog.json'
  - name: lint_report
    type: string
    value: 'lint.json'
  - name: quality_report
    type: string
    value: 'quality.json'
  - name: code_review_report
    type: string
    value: 'code-review.json'
  - name: sbom_report
    type: string
    value: 'sbom.cdx.json'
  - name: dependency_report
    type: string
    value: 'dependency.json'
  - name: trivy_report
    type: string
    value: 'trivy.json'
  - name: grype_report
    type: string
    value: 'grype.json'
  - name: snyk_report
    type: string
    value: 'snyk.json'
  - name: container_sig_report
    type: string
    value: 'cosign-verify.json'
  - name: inspec_deployed_report
    type: string
    value: 'inspec-deployed.json'
  - name: license_report
    type: string
    value: 'sonatype-policy.json'
