# =============================================================================
# Declaration — what THIS organisation's pipelines run.
#
# Pairs with files/tool_registry.yml (what the profile CAN detect). Controls
# evaluate the intersection. See docs/sdlc/ for what each stage expects.
#
# ---- The one rule that shapes this file -------------------------------------
#
# Every scan type is declared for every target, `enabled: true` or
# `enabled: false`. There is no "leave it out" option.
#
# Omission would render as Not Applicable in HDF, which reads as "does not
# apply here" rather than "nobody has looked" — a false maturity signal in an
# assessment. An explicit `enabled: false` instead produces a SKIP carrying
# "not enabled; must be manually verified and attested to", which the SAF
# attestation flow can then satisfy with a real, signed rationale.
#
# The same principle governs `exclusions`: a repository that is not scanned
# must say so, with a reason, in writing. Archived and template repositories
# are NOT auto-excluded — churn in this file when a repo is archived is the
# intended cost of never silently dropping something from the denominator.
# =============================================================================

schema_version: 1
run_mode: control-plane            # pipeline | control-plane | both

# ---- The denominator --------------------------------------------------------
# Reconciliation enumerates this organisation through the forge API and
# compares it against `targets` + `exclusions`. The truth source is deliberately
# NOT this file: an omitted repository has to be catchable from outside the
# document that omitted it.
#
#   in org, not declared, not excluded -> FAIL (undeclared repository)
#   declared, no longer in org         -> FAIL (stale declaration)
#   excluded without a reason          -> FAIL (undocumented exclusion)
organization:
  forge: github
  name: risk-sentinel

# ---- Exclusions -------------------------------------------------------------
# Empty today, and verified so: no repository in the organisation is currently
# archived, a fork, or a template. Every entry needs `reason`.
exclusions: []

# ---- Defaults ---------------------------------------------------------------
# Targets inherit this and override per key. Reflects the organisation-wide
# reusable workflows: SonarCloud analysis and TruffleHog secret scanning are
# wired almost everywhere; everything else is opted into per repository.
defaults:
  forge: github
  scans:
    sast:      { enabled: true,  tools: [sonarqube] }
    secrets:   { enabled: true,  tools: [trufflehog] }
    iac:       { enabled: false, tools: [] }
    sca:       { enabled: false, tools: [] }
    sbom:      { enabled: false, tools: [] }
    container: { enabled: false, tools: [] }
    licensing: { enabled: false, tools: [] }
    dast:      { enabled: false, tools: [] }
    iast:      { enabled: false, tools: [] }   # no IAST tooling org-wide
    runtime:   { enabled: false, tools: [] }   # post-deployment validation
    # Off by default: the profile repositories have no developer test suite
    # emitting JUnit or coverage — the InSpec profile IS the artifact. That
    # is a stated position requiring attestation, not an oversight.
    test_execution: { enabled: false, tools: [] }

# ---- Targets ----------------------------------------------------------------
# The five repositories below were inventoried from their actual workflow
# files. The remainder inherit defaults and are marked `declaration: partial`
# — they need their real tooling confirmed before this file can be trusted as
# evidence. Reconciliation counts them (they are in the denominator); it does
# not pretend their tooling is known.
targets:

  # -- inventoried from workflow files ---------------------------------------
  - repo: sparc
    declaration: confirmed
    evidence_sources:
      sonarqube: { project_key: risk-sentinel_sparc }
    scans:
      sast:      { enabled: true, tools: [codeql, semgrep, sonarqube] }
      secrets:   { enabled: true, tools: [gitleaks] }
      test_execution: { enabled: true, tools: [junit, simplecov] }
      sca:       { enabled: true, tools: [grype, trivy] }
      sbom:      { enabled: true, tools: [syft] }
      container: { enabled: true, tools: [anchore, trivy, cosign] }

  # Post-deployment validation is declared here, not inferred from the
  # pipeline. The estate is assessed by our own InSpec baselines after deploy;
  # the SDLC does not stop at the deploy step, and evidence that stops there
  # claims more than it checked.
  # SonarCloud via its API; everything else consumed as pipeline artifacts.
  # CodeQL and Semgrep are PINNED to the artifact surface: their SARIF is the
  # evidence, not GitHub code scanning. Without the pin, declaring them would
  # demand Code Security be licensed on a private repository that does not use
  # it — a finding about a product nobody bought rather than about this repo.
  - repo: sparc-iac
    declaration: confirmed
    evidence_sources:
      sonarqube: { project_key: risk-sentinel_sparc-iac }
    scans:
      sast:      { enabled: true, tools: [{ name: codeql, surface: artifact }, { name: semgrep, surface: artifact }, sonarqube] }
      secrets:   { enabled: true, tools: [trufflehog] }
      iac:       { enabled: true, tools: [checkov, { name: semgrep, surface: artifact }] }
      sca:       { enabled: true, tools: [grype, trivy] }
      sbom:      { enabled: true, tools: [syft] }
      container: { enabled: true, tools: [cosign] }
      runtime:   { enabled: true, tools: [inspec] }

  - repo: sparc-validate
    declaration: confirmed
    evidence_sources:
      sonarqube: { project_key: risk-sentinel_sparc-validate }
    scans:
      sast:      { enabled: true, tools: [sonarqube] }
      secrets:   { enabled: true, tools: [trufflehog] }
      sca:       { enabled: true, tools: [grype, trivy] }
      sbom:      { enabled: true, tools: [syft] }
      container: { enabled: true, tools: [cosign] }

  - repo: sparc-dast
    declaration: confirmed
    evidence_sources:
      sonarqube: { project_key: risk-sentinel_sparc-dast }
    scans:
      sast:    { enabled: true, tools: [sonarqube] }
      secrets: { enabled: true, tools: [trufflehog] }
      dast:    { enabled: true, tools: [burpsuite] }

  # Same model used elsewhere here: SonarCloud by API, the rest as artifacts.
  - repo: container-build-sign
    declaration: confirmed
    evidence_sources:
      sonarqube: { project_key: risk-sentinel_container-build-sign }
    scans:
      sast:      { enabled: true, tools: [{ name: codeql, surface: artifact }, sonarqube] }
      secrets:   { enabled: true, tools: [trufflehog] }
      iac:       { enabled: true, tools: [checkov] }
      sca:       { enabled: true, tools: [grype, trivy] }
      sbom:      { enabled: true, tools: [syft] }
      container: { enabled: true, tools: [anchore, trivy, cosign] }

  # -- SonarQube project keys VERIFIED against the SonarCloud projects API -----
  # Keys are NOT derivable from repository names: several carry the benchmark
  # version, and the rs-/stig- prefixes are dropped. Guessing them returns 404,
  # which is why they are declared rather than computed.
  #
  # Tooling beyond SonarQube is still unconfirmed for these repositories — they
  # inherit `defaults`, and reconciliation counts them without pretending their
  # full tooling is known.
  - repo: dev-sec-ops-baseline
    declaration: partial
    evidence_sources:
      sonarqube: { project_key: risk-sentinel_dev-sec-ops-profile }
  - repo: aws-config
    declaration: partial
    evidence_sources:
      sonarqube: { project_key: risk-sentinel_aws-config }
  - repo: cis-aws-compute-baseline
    declaration: partial
    evidence_sources:
      sonarqube: { project_key: risk-sentinel_cis-aws-compute-v1.1.0 }
  - repo: cis-aws-database-baseline
    declaration: partial
    evidence_sources:
      sonarqube: { project_key: risk-sentinel_cis-aws-database-v2.0.0 }
  - repo: cis-aws-end-user-compute-baseline
    declaration: partial
    evidence_sources:
      sonarqube: { project_key: risk-sentinel_cis-aws-end-user-compute-v1.2.0 }
  - repo: cis-aws-foundations-baseline
    declaration: partial
    evidence_sources:
      sonarqube: { project_key: risk-sentinel_cis-aws-foundations-v7.0.0 }
  - repo: cis-aws-storage-baseline
    declaration: partial
    evidence_sources:
      sonarqube: { project_key: risk-sentinel_cis-aws-storage-v1.0.0 }
  - repo: cis-docker-baseline
    declaration: partial
    evidence_sources:
      sonarqube: { project_key: risk-sentinel_cis-docker-v1.8.0 }
  - repo: cis-nginx-baseline
    declaration: partial
    evidence_sources:
      sonarqube: { project_key: risk-sentinel_cis-nginx-v3.0.0 }
  - repo: cis-postgresql-baseline
    declaration: partial
    evidence_sources:
      sonarqube: { project_key: risk-sentinel_cis-postgresql-v1.0.0 }
  - repo: cis-rhel-9-baseline
    declaration: partial
    evidence_sources:
      sonarqube: { project_key: risk-sentinel_cis-rhel-9-v2.0.0 }
  - repo: rs-aws-ecs-fargate-baseline
    declaration: partial
    evidence_sources:
      sonarqube: { project_key: risk-sentinel_aws-ecs-fargate-baseline }
  - repo: rs-aws-secrets-baseline
    declaration: partial
    evidence_sources:
      sonarqube: { project_key: risk-sentinel_aws-secrets-baseline }
  - repo: rs-cloudtrail-baseline
    declaration: partial
    evidence_sources:
      sonarqube: { project_key: risk-sentinel_cis-cloudtrail }
  - repo: stig-aws-ecr-baseline
    declaration: partial
    evidence_sources:
      sonarqube: { project_key: risk-sentinel_aws-ecr-baseline-v2r4 }

  # Inventoried from its workflows: Checkov, CodeQL, Semgrep, TruffleHog, Trivy
  # and Cosign. It is the only repository in the organisation with NO SonarCloud
  # project (code search returns zero hits), so inheriting `sast: [sonarqube]`
  # from defaults was wrong — the earlier "no project_key declared" failure was
  # this declaration being incorrect, not a missing scan.
  #
  # CodeQL and Semgrep are pinned to the artifact surface for the same reason as
  # elsewhere here: the SARIF is the evidence, and Code Security is not licensed on
  # private repositories here.
  - repo: sparc-iac-template
    declaration: confirmed
    scans:
      sast:      { enabled: true, tools: [{ name: codeql, surface: artifact }, { name: semgrep, surface: artifact }] }
      secrets:   { enabled: true, tools: [trufflehog] }
      iac:       { enabled: true, tools: [checkov] }
      sca:       { enabled: true, tools: [trivy] }
      container: { enabled: true, tools: [trivy, cosign] }
