name: Secret scan HDF emit (TruffleHog)

# This repository's caller for the reusable secret-scan-hdf.yml.
#
# Companion to secret-scan.yml, which is the GATE. The gate answers "are there
# secrets" and stops; this converts the result to HDF so it joins the same
# evidence stream as SAST, SCA and the InSpec results.
#
# Was a 160-line self-contained copy. It is a caller now because the copy had a
# defect — no emit at all on a clean scan — and fixing a copied workflow costs
# one PR per repository. The logic lives in one place so the next fix costs one.
#
# Never runs on pull_request: a fork PR would run this with write-ish intent,
# and the evidence stream should only reflect what landed on main.

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 12 * * 1'   # weekly, offset from the gate's daily run
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  # Fail fast rather than handing an empty boundary to the reusable, which would
  # label the evidence with nothing and file it at the wrong key.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Verify required configuration
        env:
          BOUNDARY: ${{ vars.EVIDENCE_BOUNDARY }}
        run: |
          set -euo pipefail
          if [ -z "${BOUNDARY:-}" ]; then
            echo "::error::EVIDENCE_BOUNDARY is not set. Set it as a repository or organization variable; it labels the evidence and has no safe default."
            exit 1
          fi

  emit:
    needs: preflight
    uses: ./.github/workflows/secret-scan-hdf.yml
    with:
      boundary: ${{ vars.EVIDENCE_BOUNDARY }}
    secrets:
      S3_EMIT_ROLE_ARN: ${{ secrets.DEV_SEC_OPS_BASELINE_EMIT_ARN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      COMPLIANCE_S3_BUCKET: ${{ secrets.COMPLIANCE_S3_BUCKET }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
