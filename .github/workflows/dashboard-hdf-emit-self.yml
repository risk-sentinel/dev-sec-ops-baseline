name: Dashboard HDF emit (this repo)

# This repository's caller for its own reusable dashboard-hdf-emit.yml.
#
# A caller rather than a copy. secret-scan-hdf-emit.yml was copied to fourteen
# repositories, and correcting it now takes fourteen pull requests — the same
# mistake is not repeated here. Every other repository gets a file that looks
# like this one, and the bridge itself is fixed in one place.
#
# Pinned to the local ref while the bridge is under development; the other
# callers pin to a tag.

on:
  push:
    branches: [main]
  schedule:
    # Dashboards change without a push: a newly published advisory raises a
    # Dependabot alert on code nobody touched. A push-only trigger would report
    # the posture as of the last commit and present it as current.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: read
  id-token: write

jobs:
  # Fail fast rather than handing an empty boundary to the reusable, which would
  # label the evidence with nothing and file it at the wrong key.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Verify required configuration
        env:
          BOUNDARY: ${{ vars.EVIDENCE_BOUNDARY }}
        run: |
          set -euo pipefail
          if [ -z "${BOUNDARY:-}" ]; then
            echo "::error::EVIDENCE_BOUNDARY is not set. Set it as a repository or organization variable; it labels the evidence and has no safe default."
            exit 1
          fi

  bridge:
    # No job-level `environment:` — it flips the OIDC subject to
    # environment:NAME and the emit-role assume fails, because the roles are
    # pinned to refs/heads/main.
    uses: ./.github/workflows/dashboard-hdf-emit.yml
    with:
      boundary: ${{ vars.EVIDENCE_BOUNDARY }}
      # This repo supplies a FORGE_TOKEN that reads all three dashboards --
      # observed at 3 of 3, not assumed. A partial document here means the token
      # lost a permission, which must be red rather than a warning nobody reads.
      require_full_coverage: true
    secrets:
      # Reads secret-scanning and Dependabot alerts, which GITHUB_TOKEN cannot.
      # Same secret exec-evidence.yml already documents as FORGE_TOKEN.
      FORGE_TOKEN: ${{ secrets.DEVSECOPS_SCAN_TOKEN }}
      S3_EMIT_ROLE_ARN: ${{ secrets.DEV_SEC_OPS_BASELINE_EMIT_ARN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      COMPLIANCE_S3_BUCKET: ${{ secrets.COMPLIANCE_S3_BUCKET }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
