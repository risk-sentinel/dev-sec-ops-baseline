name: Secret scan HDF emit (reusable)

# Runs TruffleHog, converts the result to HDF, and files it in the evidence
# store. Reusable: callers add ~12 lines rather than copying this file (#21).
#
# ---- Why this is reusable now, and was not before ---------------------------
#
# The previous version was self-contained ON PURPOSE, so it could be copied to
# fourteen repositories without a script dependency to keep in step. That was a
# reasonable call and it produced exactly the cost it was trying to avoid: a
# defect in the copied file now needs fourteen PRs to correct, which is what
# #21 is. Copying solved distribution and broke maintenance.
#
# ---- The defect this fixes --------------------------------------------------
#
# The old workflow SKIPPED the upload when TruffleHog found nothing. `hdf
# convert` errors on empty input, so skipping looked like the only option.
#
# But a clean scan is the normal case, and skipping meant a clean repository and
# a broken pipeline left byte-for-byte identical state in the bucket: nothing.
# Fourteen repositories sat that way, and the profile's coverage control read
# every one of them as unevidenced — 20 of 21 repositories failing secrets
# coverage while the scans were in fact running fine.
#
# So a clean run now emits a one-control HDF recording the EXECUTION (see
# tools/scan_receipt.py). That is not a synthesised finding: it states which
# scanner ran, at what version, over which commit, in which mode, and that it
# reported zero. Unlike code scanning there is no API to ask afterwards, so the
# run is the only witness and the record has to be written while it is true.
#
# ---- Verified-only, deliberately --------------------------------------------
#
# TruffleHog's regex detectors flag any 40-hex string as a candidate credential,
# and these repositories are full of them — every SHA-pinned action ref.
# Recording unverified hits would poison the evidence with false positives that
# then have to be triaged out of the POA&M.
#
# Never runs on pull_request: a fork PR would run this with write-ish intent,
# and the evidence stream should only reflect what landed on the default branch.

on:
  workflow_call:
    inputs:
      boundary:
        description: 'Evidence boundary — the first path segment in the bucket.'
        type: string
        required: false
        default: sparc
      profile_ref:
        description: 'Tag of dev-sec-ops-baseline supplying tools/scan_receipt.py.'
        type: string
        required: false
        default: main
      scan_path:
        description: 'Path TruffleHog scans, relative to the checkout.'
        type: string
        required: false
        default: '.'
      exclude_paths:
        description: 'TruffleHog --exclude-paths file, if the caller has one.'
        type: string
        required: false
        default: .trufflehog-exclude-paths
    secrets:
      # Declared explicitly. A reusable workflow that declares any secret
      # receives ONLY the declared ones, so an undeclared name resolves empty
      # and the step it feeds is skipped in silence.
      S3_EMIT_ROLE_ARN:
        required: false
      AWS_REGION:
        required: false
      COMPLIANCE_S3_BUCKET:
        required: false
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

permissions:
  contents: read
  id-token: write          # AWS OIDC for the S3 emit

env:
  TRUFFLEHOG_VERSION: '3.96.0'
  AUDITOR_IMAGE: risksentinel/sparc-auditor:v0.5.0

jobs:
  emit:
    name: Convert + emit secrets HDF
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the calling repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout the profile (supplies tools/scan_receipt.py)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: risk-sentinel/dev-sec-ops-baseline
          ref: ${{ inputs.profile_ref }}
          path: .devsecops-profile

      - name: Docker Hub login (auditor image pull)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Install TruffleHog (pinned + checksum-verified)
        run: |
          set -euo pipefail
          # --proto/--proto-redir pin the transport to HTTPS. `curl -L` alone
          # follows a redirect to plain HTTP, and both the tarball AND its
          # checksums arrive this way — so an attacker who can downgrade the
          # connection serves a matching pair and the checksum proves nothing.
          # A verification is only as good as the channel it arrives on.
          ver="${TRUFFLEHOG_VERSION}"
          base="https://github.com/trufflesecurity/trufflehog/releases/download/v${ver}"
          tar="trufflehog_${ver}_linux_amd64.tar.gz"
          curl -sSfL --proto '=https' --proto-redir '=https' "${base}/${tar}" -o "${tar}"
          curl -sSfL --proto '=https' --proto-redir '=https' "${base}/trufflehog_${ver}_checksums.txt" -o checksums.txt
          grep " ${tar}\$" checksums.txt | sha256sum -c -
          tar -xzf "${tar}" trufflehog
          sudo install -m 0755 trufflehog /usr/local/bin/trufflehog
          trufflehog --version

      - name: TruffleHog scan
        id: tf
        env:
          SCAN_PATH: ${{ inputs.scan_path }}
          EXCLUDES: ${{ inputs.exclude_paths }}
        run: |
          set -euo pipefail
          # Findings go to stdout as JSONL, logs to stderr. Do NOT fold the JSONL
          # into a JSON array: hdf auto-detects raw TruffleHog JSONL and wrapping
          # it breaks detection.
          args=(filesystem "$SCAN_PATH" --json --only-verified)
          [ -f "$EXCLUDES" ] && args+=(--exclude-paths="$EXCLUDES")
          trufflehog "${args[@]}" > trufflehog.json 2>/dev/null || true
          n="$(grep -c . trufflehog.json || true)"
          echo "findings=$n" | tee -a "$GITHUB_OUTPUT"

      - name: Build HDF — findings, or an execution record
        env:
          FINDINGS: ${{ steps.tf.outputs.findings }}
          OUT: out/trufflehog-hdf.json
        run: |
          set -euo pipefail
          mkdir -p out
          ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          if [ "$FINDINGS" != "0" ]; then
            docker run --rm -v "$PWD:/w" -w /w --entrypoint hdf "$AUDITOR_IMAGE" \
              convert trufflehog.json -o "$OUT"
            echo "::warning::TruffleHog reported ${FINDINGS} verified secret(s) — converted to HDF."
          else
            # The case the old workflow skipped. See tools/scan_receipt.py.
            python3 .devsecops-profile/tools/scan_receipt.py \
              --scanner trufflehog \
              --repo "${GITHUB_REPOSITORY}" \
              --sha "${GITHUB_SHA}" \
              --ref "${GITHUB_REF}" \
              --run-id "${GITHUB_RUN_ID}" \
              --findings 0 \
              --scanner-version "${TRUFFLEHOG_VERSION}" \
              --mode filesystem \
              --timestamp "$ts" \
              --out "$OUT"
          fi

      - name: Label, validate, summarise
        env:
          OUT: out/trufflehog-hdf.json
        run: |
          set -euo pipefail
          # Provenance labels. Without them the HDF says what was found but not
          # where or when, and evidence that cannot be tied to a commit is not
          # evidence. The profile's evidence_store surface reads these to
          # corroborate the key path it was filed under.
          docker run --rm -v "$PWD:/w" -w /w --entrypoint hdf "$AUDITOR_IMAGE" \
            label set "$OUT" \
              scanner=trufflehog \
              "target=${GITHUB_REPOSITORY##*/}" \
              "repo=${GITHUB_REPOSITORY}" \
              "commit=${GITHUB_SHA}" \
              "ref=${GITHUB_REF}" \
              "run_id=${GITHUB_RUN_ID}"

          # NOT `hdf validate`. hdf 3.4.1 validates the newer baselines[] schema
          # and rejects legacy profiles[] — which is what every saf converter
          # emits, including trufflehog2hdf. The previous workflow called it and
          # would have failed the job the first time a real secret was found;
          # nobody hit it because the scan is always clean and the whole branch
          # was skipped. Same defect class as the missing emit.
          #
          # So assert the shape that actually matters here: it parses, and it
          # carries at least one control with at least one result.
          python3 - "$OUT" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          profiles = d.get("profiles") or d.get("baselines") or []
          controls = [c for p in profiles for c in p.get("controls", [])]
          results = [r for c in controls for r in c.get("results", [])]
          if not controls or not results:
              print(f"::error::{sys.argv[1]} has {len(controls)} control(s) and "
                    f"{len(results)} result(s) — nothing to file as evidence")
              sys.exit(1)
          print(f"OK: {len(profiles)} profile(s), {len(controls)} control(s), "
                f"{len(results)} result(s)")
          PY

          # In the job log, not only in the artifact: a file holding nothing and
          # a conversion that silently failed produce identical green checks.
          echo "::group::saf view summary"
          docker run --rm -v "$PWD:/w" -w /w --entrypoint saf "$AUDITOR_IMAGE" \
            view summary -i "$OUT"
          echo "::endgroup::"

      - name: Upload HDF artifact (evidence even without S3)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trufflehog-hdf-${{ github.run_id }}
          path: out/trufflehog-hdf.json
          if-no-files-found: error
          retention-days: 90

      - name: Configure AWS credentials (OIDC)
        id: aws
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ secrets.S3_EMIT_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Emit to the evidence bucket
        # Gated on the credential step SUCCEEDING, not merely running.
        if: steps.aws.outcome == 'success'
        env:
          BUCKET: ${{ secrets.COMPLIANCE_S3_BUCKET }}
          BOUNDARY: ${{ inputs.boundary }}
        run: |
          set -euo pipefail
          # Canonical layout, and the exact key the profile's evidence_store
          # surface heads: <boundary>/<date|latest>/<repo>/<source>/<source>-hdf.json
          repo="${GITHUB_REPOSITORY##*/}"
          d="$(date -u +%Y-%m-%d)"
          for slot in "$d" latest; do
            aws s3 cp out/trufflehog-hdf.json \
              "s3://${BUCKET}/${BOUNDARY}/${slot}/${repo}/trufflehog/trufflehog-hdf.json" \
              --content-type application/json
          done
          echo "Emitted to ${BOUNDARY}/{${d},latest}/${repo}/trufflehog/"

      - name: Report a skipped emit
        if: steps.aws.outcome != 'success'
        run: |
          echo "::warning::AWS credentials were not configured, so nothing reached the evidence bucket. The HDF is attached to this run as an artifact. Check the emit-role secret name — a missing secret resolves empty and this step is the only place that says so."
