# =============================================================================
# Tool registry — what this profile CAN detect, and where.
#
# This file is profile-owned knowledge, NOT user input. It answers
# "what is detectable, on which surface, and have we built it yet?"
# The user's declaration (inputs/*.yml) answers "what does my pipeline run?"
# Controls evaluate the intersection of the two.
#
# The README coverage matrix is GENERATED from this file by
# tools/render_matrix.py. Never hand-edit that table — edit here and re-render,
# so documented coverage cannot drift from real coverage.
#
# ---- Detection surfaces, and what each is allowed to prove ------------------
#
# Surfaces differ by ACCESS REQUIREMENT, and — critically — by ROLE. Only
# execution evidence may satisfy a scan type.
#
#   artifact        role: execution
#                   A report file on disk. Requires in-pipeline execution,
#                   after the scanner stage. Cannot be read out-of-band.
#   platform_api    role: execution
#                   State held by a forge or evidence source. Requires a token.
#   repo_contents   role: configuration
#                   A fact about a file in the repository (workflow triggers,
#                   CODEOWNERS, scanner config). Requires a clone or the
#                   contents API.
#
# ---- Why repo_contents cannot satisfy a scan type ---------------------------
#
# A workflow file naming TruffleHog proves somebody WIRED IT UP. It does not
# prove it ran, that it ran on this commit, or that it produced anything. A
# scan type is satisfied only by evidence of EXECUTION: an emitted artifact, or
# platform state recording findings.
#
# repo_contents still matters — it answers a different question. Whether the
# scan fires on a merge request (shift-left) and whether CODEOWNERS covers the
# security paths (governance) are facts about files and nothing else can report
# them. They are governance controls, never coverage controls.
#
# ---- Artifact filenames are PATTERNS, not fixed names -----------------------
#
# Teams stamp report filenames with a timestamp, a commit SHA, or what was
# scanned — `trivy-2026-08-15.json`, `grype-api-image.json`,
# `sast-20260815T1000.sarif`. A registry of exact filenames would report those
# pipelines as having run no scans at all, which is the worst possible failure
# direction: a silent false negative dressed as a finding.
#
# `patterns` is therefore a list of globs. Resolution rules:
#   - zero matches while the scan is declared enabled -> FAIL
#   - one or more matches -> EVERY match must be structurally valid, not just
#     the first. A pipeline emitting one good report and one truncated one has
#     a problem, and "the first file parsed" would hide it.
#   - the match count is reported, so a run that found six Trivy reports where
#     one was expected is visible rather than silently collapsed.
#
# A target may override `patterns` in its declaration when local naming is
# unusual. See ArtifactHelper.match in libraries/artifact_helper.rb.
#
# Every surface entry carries `status:`
#   implemented  this profile can evaluate it today
#   planned      detectable in principle; not built yet
# A surface key that is ABSENT means the tool is not detectable that way at all
# (e.g. a forge-native feature leaves no artifact on the runner).
#
# ---- Result semantics these statuses drive ----------------------------------
#
#   declared enabled + surface implemented -> real check (pass / fail)
#   declared NOT enabled                   -> skip, "must be manually verified
#                                             and attested to" (attestation
#                                             picks it up)
#   declared enabled + surface planned     -> skip, coverage-gap rationale.
#                                             This is OUR gap, not a repository
#                                             finding, and is deliberately
#                                             worded differently so the two
#                                             skips stay distinguishable in HDF
#                                             and only the first is an
#                                             attestation candidate.
#
# There is no "not declared" state. Omission would render as Not Applicable,
# which reads as "does not apply" rather than "nobody looked" — a false
# maturity signal. Every scan type is declared, enabled true or false.
# =============================================================================

schema_version: 1

# ---- Surface roles ----------------------------------------------------------
# Consumed by CapabilityMatrix: only `execution` surfaces count toward scan-type
# coverage. Declared here rather than hardcoded in Ruby so adding a surface is a
# registry edit.
surfaces:
  artifact:
    role: execution
    title: Report file on disk
    access: In-pipeline execution, after the scanner stage
  platform_api:
    role: execution
    title: Forge or evidence-source state
    access: A token
  repo_contents:
    role: configuration
    title: A file in the repository
    access: A clone, or the contents API

# ---- Run modes --------------------------------------------------------------
# Which surfaces are reachable in each mode. A scan type can only be shown
# covered by a surface the current mode can actually read.
run_modes:
  pipeline:      [artifact]
  control-plane: [platform_api, repo_contents]
  both:          [artifact, platform_api, repo_contents]

# ---- Evidence sources -------------------------------------------------------
# A forge hosts code AND enforces merge rules. An evidence source has an API
# and no forge duties. Collapsing these makes "which forge enforces MR rules?"
# unanswerable, so they stay distinct.
sources:
  github:
    name: GitHub
    kind: forge
    api_base: https://api.github.com
    enforces_merge_rules: true
    docs: https://docs.github.com/en/rest
  gitlab:
    name: GitLab
    kind: forge
    api_base: null                  # per-instance; supplied by the declaration
    enforces_merge_rules: true
    docs: https://docs.gitlab.com/api/
  sonarqube:
    name: SonarQube / SonarCloud
    kind: evidence
    api_base: https://sonarcloud.io
    enforces_merge_rules: false
    docs: https://sonarcloud.io/web_api
  aws:
    name: AWS
    kind: cloud
    api_base: null                  # per-region service endpoints
    enforces_merge_rules: false
    docs: https://docs.aws.amazon.com/
  pipeline:
    name: Pipeline artifacts
    kind: artifact
    api_base: null
    enforces_merge_rules: false
    docs: null

# ---- Capabilities -----------------------------------------------------------
# A capability is the abstract thing being read; a binding is how a given source
# exposes it. Tool surfaces reference `capability:` and the README generator
# resolves the bindings into linked endpoint documentation, so API references
# live here once instead of being hand-maintained in prose.
#
# Structural difference worth knowing before writing the resource: GitHub
# exposes a SEPARATE endpoint per capability (code scanning, secret scanning and
# Dependabot are three different routes with three different enablement states
# and three different failure codes). GitLab funnels SAST, secret detection,
# dependency scanning and container scanning through ONE vulnerability-findings
# endpoint discriminated by `report_type`. The resource interface is shared;
# the fan-out behind it is not, and gitlab_security collapses to far fewer
# round-trips as a result.
capabilities:

  repo_enumeration:
    title: Repository enumeration — the denominator
    why: >-
      The independent truth source for reconciliation. Must never be the same
      file being verified, or an omitted repository is invisible.
    bindings:
      github:
        endpoint: GET /orgs/{org}/repos
        docs: https://docs.github.com/en/rest/repos/repos
      gitlab:
        endpoint: GET /groups/{id}/projects
        docs: https://docs.gitlab.com/api/groups/

  code_scanning:
    title: Static analysis findings
    bindings:
      github:
        endpoint: GET /repos/{owner}/{repo}/code-scanning/alerts
        docs: https://docs.github.com/en/rest/code-scanning/code-scanning
        disabled_status: 403
      gitlab:
        endpoint: GET /projects/{id}/vulnerability_findings?report_type=sast
        docs: https://docs.gitlab.com/api/vulnerability_findings/

  secret_scanning:
    title: Secrets findings and push protection
    bindings:
      github:
        endpoint: GET /repos/{owner}/{repo}/secret-scanning/alerts
        docs: https://docs.github.com/en/rest/secret-scanning/secret-scanning
        disabled_status: 404
      gitlab:
        endpoint: GET /projects/{id}/vulnerability_findings?report_type=secret_detection
        docs: https://docs.gitlab.com/api/vulnerability_findings/
        push_protection_docs: https://docs.gitlab.com/api/projects/

  dependabot_alerts:
    title: Dependency vulnerability findings
    bindings:
      github:
        endpoint: GET /repos/{owner}/{repo}/dependabot/alerts
        docs: https://docs.github.com/en/rest/dependabot/alerts
        disabled_status: 403
      gitlab:
        endpoint: GET /projects/{id}/dependencies
        docs: https://docs.gitlab.com/api/dependencies/

  sbom_export:
    title: Platform-generated SBOM
    bindings:
      github:
        endpoint: GET /repos/{owner}/{repo}/dependency-graph/sbom
        docs: https://docs.github.com/en/rest/dependency-graph/sboms
      gitlab:
        endpoint: GET /projects/{id}/dependencies
        docs: https://docs.gitlab.com/api/dependencies/

  branch_protection:
    title: Protected-branch rules
    bindings:
      github:
        endpoint: GET /repos/{owner}/{repo}/branches/{branch}/protection
        docs: https://docs.github.com/en/rest/branches/branch-protection
      gitlab:
        endpoint: GET /projects/{id}/protected_branches
        docs: https://docs.gitlab.com/api/protected_branches/

  required_reviews:
    title: Merge-request review requirements
    why: >-
      API state, not repository content — this is the half of the MR/PR rules
      question that a token can answer.
    bindings:
      github:
        endpoint: GET /repos/{owner}/{repo}/branches/{branch}/protection
        docs: https://docs.github.com/en/rest/branches/branch-protection
      gitlab:
        endpoint: GET /projects/{id}/approval_rules
        docs: https://docs.gitlab.com/api/merge_request_approvals/

  rulesets:
    title: Repository rulesets and push rules
    bindings:
      github:
        endpoint: GET /repos/{owner}/{repo}/rulesets
        docs: https://docs.github.com/en/rest/repos/rules
      gitlab:
        endpoint: GET /projects/{id} (push_rules)
        docs: https://docs.gitlab.com/api/projects/

  config_compliance:
    title: Post-deployment configuration compliance
    why: >-
      Validation does not stop at the pipeline. Deployed resources drift, and
      an assessment covering only build-time evidence claims more than it
      checked.
    bindings:
      aws:
        endpoint: DescribeComplianceByConfigRule
        docs: https://docs.aws.amazon.com/config/latest/APIReference/API_DescribeComplianceByConfigRule.html

  runtime_findings:
    title: Aggregated post-deployment security findings
    bindings:
      aws:
        endpoint: GetFindings (Security Hub)
        docs: https://docs.aws.amazon.com/securityhub/1.0/APIReference/API_GetFindings.html

  repo_contents:
    title: File contents — workflow triggers, CODEOWNERS, scanner config
    why: >-
      The other half of the MR/PR rules question. Whether a scan fires on a
      merge request at all is a fact about a YAML file, not platform state, and
      needs a clone or the contents API rather than a policy read.
    bindings:
      github:
        endpoint: GET /repos/{owner}/{repo}/contents/{path}
        docs: https://docs.github.com/en/rest/repos/contents
      gitlab:
        endpoint: GET /projects/{id}/repository/files/{path}
        docs: https://docs.gitlab.com/api/repository_files/

# ---- SDLC stages ------------------------------------------------------------
# Each stage gets a reference doc under docs/sdlc/, linked from the README.
sdlc_stages:
  plan:    { title: Plan and Design, doc: docs/sdlc/plan.md }
  code:    { title: Code,            doc: docs/sdlc/code.md }
  build:   { title: Build,           doc: docs/sdlc/build.md }
  test:    { title: Test,            doc: docs/sdlc/test.md }
  deploy:  { title: Deploy,          doc: docs/sdlc/deploy.md }
  operate: { title: Operate,         doc: docs/sdlc/operate.md }   # post-deployment validation lives here

# ---- Scan types -------------------------------------------------------------
# `aliases` settles vendor-vocabulary collisions once, here, rather than
# letting both spellings drift through the codebase.
scan_types:
  sast:
    title: Static Application Security Testing
    sdlc_stage: code
    nist: ['SA-11(1)']
    ssdf: [PW.7, PW.8]
    description: Analyses source without executing it.

  secrets:
    title: Secrets Detection
    sdlc_stage: code
    nist: ['IA-5(7)', 'SA-11']
    ssdf: [PW.1]
    description: Finds embedded static authenticators in source and git history.

  iac:
    title: Infrastructure as Code Scanning
    sdlc_stage: code
    nist: ['CM-2', 'CM-6', 'RA-5']
    ssdf: [PW.9]
    description: Misconfiguration analysis of declarative infrastructure.

  sca:
    title: Software Composition Analysis
    aliases: [dependency]
    sdlc_stage: build
    nist: ['RA-5', 'SA-11(1)', 'SR-3']
    ssdf: [RV.1, PW.4]
    description: >-
      Known-vulnerable third-party components. GitLab calls this "Dependency
      Scanning"; `sca` is canonical here and `dependency` resolves to it.

  sbom:
    title: Software Bill of Materials
    sdlc_stage: build
    nist: ['SR-3', 'SR-4']
    ssdf: [PS.3, PW.4]
    description: Component inventory and provenance record.

  container:
    title: Container Image Scanning
    sdlc_stage: build
    nist: ['RA-5', 'CM-6', 'SR-3']
    ssdf: [RV.1]
    description: >-
      Vulnerability and misconfiguration analysis of a built image. Frequently
      the same binary as `sca` pointed at a different target — the target is
      what separates the two axes, not the tool.

  licensing:
    title: Software Licensing Review
    sdlc_stage: build
    nist: ['SR-3', 'SA-4']
    ssdf: [PW.4]
    description: OSS licence governance over acquired and reused components.

  dast:
    title: Dynamic Application Security Testing
    sdlc_stage: test
    nist: ['SA-11(8)', 'RA-5', 'CA-8']
    ssdf: [PW.8, RV.1]
    description: Exercises a running application from the outside.

  runtime:
    title: Post-Deployment Validation
    aliases: [post_deploy, continuous_monitoring]
    sdlc_stage: operate
    nist: ['CA-2(2)', 'CA-7', 'CM-6', 'RA-5']
    ssdf: [RV.1, PW.9]
    description: >-
      Assessment of what is actually deployed, not what was built. The SDLC
      does not end at deploy: configuration drifts, and a pipeline that was
      clean at build time says nothing about the running estate. This is where
      our own InSpec baselines, AWS Config rules and Security Hub findings
      land. The existing `artifact-inspec-deployed` control belongs to this
      scan type.

  iast:
    title: Interactive Application Security Testing
    sdlc_stage: test
    nist: ['SA-11(9)']
    ssdf: [PW.8]
    description: >-
      Instrumented analysis of a running application. NIST 800-53r5 names this
      exactly at SA-11(9). No tooling anywhere in the organisation today — this
      entry exists so the gap is declared rather than silently absent.

# ---- Tools ------------------------------------------------------------------
# Surface statuses here are what the README matrix renders. `implemented` on
# `artifact` reflects the fourteen presence controls already shipped; every
# platform_api and repo_contents surface is `planned` until its phase lands.
tools:

  # -- SAST -------------------------------------------------------------------
  codeql:
    name: CodeQL
    scan_types: [sast]
    surfaces:
      artifact:
        status: implemented
        format: sarif
        marker: runs
        patterns:
          - '*codeql*.sarif'
          - 'sast*.sarif'
      platform_api:
        status: planned
        sources: [github]
        capability: code_scanning
        filter: { tool_name: CodeQL }
      repo_contents:
        status: planned
        sources: [github, gitlab]
        evidence: workflow_uses
        match: github/codeql-action

  semgrep:
    name: Semgrep
    scan_types: [sast, iac]
    surfaces:
      artifact:
        status: implemented
        format: sarif
        marker: runs
        patterns:
          - '*semgrep*.sarif'
          - '*semgrep*.json'
      platform_api:
        status: planned
        sources: [github, gitlab]
        capability: code_scanning
        filter: { tool_name: Semgrep }
      repo_contents:
        status: planned
        sources: [github, gitlab]
        evidence: workflow_uses
        match: semgrep

  sonarqube:
    name: SonarQube
    scan_types: [sast]
    surfaces:
      artifact:
        status: implemented
        format: json
        marker: null
        patterns:
          - '*sonar*.json'
          - 'quality*.json'
      platform_api:
        status: planned
        sources: [sonarqube]
        capability: issues
      repo_contents:
        status: planned
        sources: [github, gitlab]
        evidence: config_file
        match: sonar-project.properties

  bandit:
    name: Bandit
    scan_types: [sast]
    surfaces:
      artifact:
        status: implemented
        format: json
        marker: results
        patterns:
          - '*bandit*.json'
      repo_contents:
        status: planned
        sources: [github, gitlab]
        evidence: workflow_uses
        match: bandit

  # -- Secrets ----------------------------------------------------------------
  trufflehog:
    name: TruffleHog
    scan_types: [secrets]
    surfaces:
      artifact:
        status: implemented
        format: jsonl
        marker: null
        patterns:
          - '*trufflehog*.json'
          - '*trufflehog*.jsonl'
      repo_contents:
        status: planned
        sources: [github, gitlab]
        evidence: workflow_uses
        match: trufflehog

  gitleaks:
    name: Gitleaks
    scan_types: [secrets]
    surfaces:
      artifact:
        status: implemented
        format: json
        marker: null
        patterns:
          - '*gitleaks*.json'
      repo_contents:
        status: planned
        sources: [github, gitlab]
        evidence: workflow_uses
        match: gitleaks

  platform_secret_scanning:
    name: Forge-native secret scanning
    scan_types: [secrets]
    # Forge-native: nothing lands on the runner, so there is no artifact surface.
    # GitHub calls this "secret scanning"; GitLab calls it "Secret Detection".
    # Same capability, same control, different vendor noun.
    surfaces:
      platform_api:
        status: planned
        sources: [github, gitlab]
        capability: secret_scanning
        also: [push_protection]

  # -- SCA --------------------------------------------------------------------
  grype:
    name: Grype
    scan_types: [sca, container]
    surfaces:
      artifact:
        status: implemented
        format: json
        marker: descriptor.name
        patterns:
          - '*grype*.json'
      repo_contents:
        status: planned
        sources: [github, gitlab]
        evidence: workflow_uses
        match: anchore/scan-action

  trivy:
    name: Trivy
    scan_types: [sca, container, iac, secrets, licensing]
    surfaces:
      artifact:
        status: implemented
        format: json
        marker: SchemaVersion
        patterns:
          - '*trivy*.json'
      repo_contents:
        status: planned
        sources: [github, gitlab]
        evidence: workflow_uses
        match: aquasecurity/trivy-action

  snyk:
    name: Snyk
    scan_types: [sca, licensing]
    surfaces:
      artifact:
        status: implemented
        format: json
        marker: vulnerabilities
        patterns:
          - '*snyk*.json'
      repo_contents:
        status: planned
        sources: [github, gitlab]
        evidence: workflow_uses
        match: snyk

  dependabot:
    name: Dependabot
    scan_types: [sca]
    surfaces:
      platform_api:
        status: planned
        sources: [github]
        capability: dependabot_alerts
        also: [security_updates]
      repo_contents:
        status: planned
        sources: [github]
        evidence: config_file
        match: .github/dependabot.yml

  gitlab_dependency_scanning:
    name: GitLab Dependency Scanning
    scan_types: [sca]
    # GitLab's native equivalent of Dependabot. Kept as its own entry rather
    # than folded into `dependabot`, because they are different products with
    # different enablement semantics — only the capability they satisfy is
    # shared.
    surfaces:
      platform_api:
        status: planned
        sources: [gitlab]
        capability: dependabot_alerts
      repo_contents:
        status: planned
        sources: [gitlab]
        evidence: config_file
        match: .gitlab-ci.yml

  sonatype:
    name: Sonatype
    scan_types: [sca, licensing]
    surfaces:
      artifact:
        status: implemented
        format: json
        marker: null
        patterns:
          - '*sonatype*.json'

  # -- SBOM -------------------------------------------------------------------
  syft:
    name: Syft
    scan_types: [sbom]
    surfaces:
      artifact:
        status: implemented
        format: cyclonedx
        marker: bomFormat
        patterns:
          - '*.cdx.json'
          - '*sbom*.json'
          - '*syft*.json'
      repo_contents:
        status: planned
        sources: [github, gitlab]
        evidence: workflow_uses
        match: anchore/sbom-action

  # -- Container --------------------------------------------------------------
  anchore:
    name: Anchore
    scan_types: [container]
    surfaces:
      artifact:
        status: implemented
        format: json
        marker: null
        patterns:
          - '*anchore*.json'

  # -- IaC --------------------------------------------------------------------
  checkov:
    name: Checkov
    scan_types: [iac]
    surfaces:
      artifact:
        status: planned
        format: sarif
        marker: runs
        patterns:
          - '*checkov*.sarif'
          - '*checkov*.json'
      repo_contents:
        status: planned
        sources: [github, gitlab]
        evidence: workflow_uses
        match: bridgecrewio/checkov-action

  tfsec:
    name: tfsec
    scan_types: [iac]
    surfaces:
      artifact:
        status: planned
        format: sarif
        marker: runs
        patterns:
          - '*tfsec*.sarif'

  # -- DAST -------------------------------------------------------------------
  burpsuite:
    name: Burp Suite
    scan_types: [dast]
    surfaces:
      artifact:
        status: planned
        format: hdf
        marker: profiles
        patterns:
          - '*burp*.json'

  zap:
    name: OWASP ZAP
    scan_types: [dast]
    surfaces:
      artifact:
        status: planned
        format: json
        marker: null
        patterns:
          - '*zap*.json'

  # -- IAST -------------------------------------------------------------------
  # Intentionally empty. `iast` appears in scan_types with no tool referencing
  # it, so the matrix renders a row with no coverage rather than omitting the
  # concept. An absent row would imply the scan type does not exist; an empty
  # row states plainly that nothing in the organisation performs it.

  # -- Post-deployment --------------------------------------------------------
  inspec:
    name: InSpec / CINC baselines
    scan_types: [runtime]
    # Our own profile estate — the CIS, STIG and bespoke baselines. This is the
    # OTHER InSpec run (against live infrastructure); the check here confirms
    # its results artifact reached the pipeline, not that the run passed.
    surfaces:
      artifact:
        status: implemented
        format: json
        marker: profiles
        patterns:
          - '*inspec*.json'
          - '*hdf*.json'

  aws_config:
    name: AWS Config
    scan_types: [runtime]
    surfaces:
      artifact:
        status: planned
        format: json
        marker: null
        patterns:
          - '*aws-config*.json'
          - '*config-snapshot*.json'
      platform_api:
        status: planned
        sources: [aws]
        capability: config_compliance

  aws_security_hub:
    name: AWS Security Hub
    scan_types: [runtime]
    surfaces:
      artifact:
        status: planned
        format: json
        marker: null
        patterns:
          - '*securityhub*.json'
          - '*security-hub*.json'
      platform_api:
        status: planned
        sources: [aws]
        capability: runtime_findings

  prowler:
    name: Prowler
    scan_types: [runtime]
    surfaces:
      artifact:
        status: planned
        format: json
        marker: null
        patterns:
          - '*prowler*.json'

  # -- Supply-chain integrity -------------------------------------------------
  cosign:
    name: Cosign
    scan_types: [container]
    surfaces:
      artifact:
        status: implemented
        format: json
        marker: null
        patterns:
          - '*cosign*.json'
